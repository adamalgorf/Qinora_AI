databases:
  - name: qinora-db
    plan: starter
    postgresMajorVersion: "16"

services:
  - type: pserv
    name: backend
    env: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: starter
    envVars:
      - key: EMAIL_WEBHOOK_SECRET
        generateValue: true
      - key: QINORA_AUTH_TOKEN_SECRET
        generateValue: true
      - key: QINORA_PERSISTENCE
        value: postgres
      - key: QINORA_POSTGRES_TENANT_ID
        value: "00000000-0000-0000-0000-000000000001"
      - key: DATABASE_URL
        fromDatabase:
          name: qinora-db
          property: connectionString

  - type: web
    name: frontend
    env: docker
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: .
    plan: starter
