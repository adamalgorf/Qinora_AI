services:
  - type: web
    name: qinora-backend
    env: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    envVars:
      - key: EMAIL_WEBHOOK_SECRET
        generateValue: true
      - key: QINORA_AUTH_TOKEN_SECRET
        generateValue: true
      - key: QINORA_PERSISTENCE
        value: postgres
      - key: QINORA_POSTGRES_TENANT_ID
        value: "00000000-0000-0000-0000-000000000001"
      # Paste the connection string from your Supabase project's
      # Project Settings -> Database -> Connection string (URI).
      - key: DATABASE_URL
        sync: false
      # Fill in once the frontend static site's URL is known (see below).
      - key: CORS_ALLOWED_ORIGINS
        sync: false

  - type: web
    name: qinora-frontend
    env: static
    buildCommand: npm ci && npm run build -w @qinora/frontend
    staticPublishPath: frontend/dist
    envVars:
      # Fill in once the backend service's URL is known, e.g.
      # https://qinora-backend.onrender.com (no trailing slash, no /api).
      - key: VITE_API_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
