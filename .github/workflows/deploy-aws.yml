name: Deploy to AWS

# Runs after CI passes on main. Builds both images, pushes to ECR, then
# triggers an App Runner deployment for each service. The three worker ECS
# task definitions (infra/aws/ecs_workers.tf) always reference the ":latest"
# tag, so they pick up a new image on their next scheduled run automatically
# - no separate update step needed for them.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

permissions:
  id-token: write # for OIDC -> AWS
  contents: read

jobs:
  deploy:
    name: Build, push, deploy
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Login to ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push backend image
        working-directory: backend
        run: |
          docker build -t "${{ vars.BACKEND_ECR_REPOSITORY_URL }}:latest" .
          docker push "${{ vars.BACKEND_ECR_REPOSITORY_URL }}:latest"

      - name: Build and push frontend image
        run: |
          docker build \
            -f frontend/Dockerfile \
            --build-arg VITE_API_URL="${{ vars.BACKEND_API_URL }}" \
            -t "${{ vars.FRONTEND_ECR_REPOSITORY_URL }}:latest" \
            .
          docker push "${{ vars.FRONTEND_ECR_REPOSITORY_URL }}:latest"

      - name: Deploy backend App Runner service
        run: |
          aws apprunner start-deployment \
            --service-arn "${{ vars.BACKEND_APPRUNNER_SERVICE_ARN }}"

      - name: Deploy frontend App Runner service
        run: |
          aws apprunner start-deployment \
            --service-arn "${{ vars.FRONTEND_APPRUNNER_SERVICE_ARN }}"
