services:
  backend:
    build:
      context: ./backend
    environment:
      EMAIL_WEBHOOK_SECRET: ${EMAIL_WEBHOOK_SECRET:-dev-secret}
      QINORA_PERSISTENCE: ${QINORA_PERSISTENCE:-sqlite}
      QINORA_AUTH_TOKEN_SECRET: ${QINORA_AUTH_TOKEN_SECRET:-dev-auth-secret}
      QINORA_POSTGRES_TENANT_ID: ${QINORA_POSTGRES_TENANT_ID:-00000000-0000-0000-0000-000000000001}
      QINORA_SQLITE_PATH: /app/data/qinora.sqlite3
      DATABASE_URL: ${DATABASE_URL:-postgres://postgres:postgres@postgres:5432/qinora}
      LLM_PROVIDER: ${LLM_PROVIDER:-stub}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      QINORA_CUSTOMER_MAILBOX: ${QINORA_CUSTOMER_MAILBOX:-}
      QINORA_CARRIER_MAILBOX: ${QINORA_CARRIER_MAILBOX:-}
    ports:
      - "8000:8000"
    volumes:
      - qinora_data:/app/data
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=3).read()",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_URL: /api
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8080:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/health >/dev/null"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

  # outbound-mailer (workers/outbound_mailer.py, RecordingOutboundMailer) is
  # intentionally NOT defined here anymore - it's a no-op test double that
  # marks outbound_reply_queue items "sent" without ever actually delivering
  # them, and it drains the same queue as outlook-bridge below. Run
  # alongside it, it silently swallows real customer-facing emails (quotes,
  # booking confirmations) - reproduced live 2026-09-15/16. The real send
  # path is workers/outlook_bridge.py (or, if the Outlook bridge isn't
  # configured, integrations/gmail-intake-bridge/Code.gs) - see
  # interfaces/http/routers/outbound.py's module docstring. Do not add this
  # service back without also gating it so it can never run at the same
  # time as outlook-bridge.

  tracking-simulator:
    build:
      context: ./backend
    depends_on:
      backend:
        condition: service_healthy
    environment: &worker_environment
      EMAIL_WEBHOOK_SECRET: ${EMAIL_WEBHOOK_SECRET:-dev-secret}
      QINORA_PERSISTENCE: ${QINORA_PERSISTENCE:-sqlite}
      QINORA_AUTH_TOKEN_SECRET: ${QINORA_AUTH_TOKEN_SECRET:-dev-auth-secret}
      QINORA_POSTGRES_TENANT_ID: ${QINORA_POSTGRES_TENANT_ID:-00000000-0000-0000-0000-000000000001}
      QINORA_SQLITE_PATH: /app/data/qinora.sqlite3
      DATABASE_URL: ${DATABASE_URL:-postgres://postgres:postgres@postgres:5432/qinora}
      LLM_PROVIDER: ${LLM_PROVIDER:-stub}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      QINORA_CUSTOMER_MAILBOX: ${QINORA_CUSTOMER_MAILBOX:-}
      QINORA_CARRIER_MAILBOX: ${QINORA_CARRIER_MAILBOX:-}
    volumes:
      - qinora_data:/app/data
    entrypoint: sh -c
    command:
      - 'while true; do python -m qinora.workers.tracking_simulator; sleep 60; done'
    healthcheck:
      disable: true

  stale-request-escalator:
    build:
      context: ./backend
    depends_on:
      backend:
        condition: service_healthy
    environment: *worker_environment
    volumes:
      - qinora_data:/app/data
    entrypoint: sh -c
    command:
      - 'while true; do python -m qinora.workers.stale_request_escalator; sleep 300; done'
    healthcheck:
      disable: true

  # Outlook / Microsoft 365 intake bridge - replaces the Gmail Apps Script.
  # Off by default (profile) since it needs real Graph credentials; run with
  # `docker compose --profile outlook up` once .env has the OUTLOOK_* values.
  outlook-bridge:
    build:
      context: ./backend
    profiles:
      - outlook
    depends_on:
      backend:
        condition: service_healthy
    environment:
      <<: *worker_environment
      QINORA_API_BASE_URL: http://backend:8000
      OUTLOOK_TENANT_ID: ${OUTLOOK_TENANT_ID:-}
      OUTLOOK_CLIENT_ID: ${OUTLOOK_CLIENT_ID:-}
      OUTLOOK_CLIENT_SECRET: ${OUTLOOK_CLIENT_SECRET:-}
      OUTLOOK_REFRESH_TOKEN: ${OUTLOOK_REFRESH_TOKEN:-}
      OUTLOOK_MAILBOXES: ${OUTLOOK_MAILBOXES:-}
      OUTLOOK_SEND_MAILBOX: ${OUTLOOK_SEND_MAILBOX:-}
      OUTLOOK_SENDER_NAME: ${OUTLOOK_SENDER_NAME:-Sandahls}
    volumes:
      - qinora_data:/app/data
    entrypoint: sh -c
    command:
      - 'while true; do python -m qinora.workers.outlook_bridge; sleep 60; done'
    healthcheck:
      disable: true

  # Second bridge instance, delegated-auth-signed-in as qinora.ai@sandahls.com
  # instead of test.spedition@sandahls.com - a delegated refresh token can
  # only ever reach the mailbox it was signed in as (see
  # workers/outlook_bridge.py's module docstring), so bridging two mailboxes
  # needs two instances. Each only sends the outbound items addressed to its
  # own mailbox (application/pricing_engine.py / application/quote_workflow.py's
  # sender_mailbox routing, filtered in workers/outlook_bridge.py's
  # _mailbox_matches) - safe to run alongside outlook-bridge without racing it
  # for the same queued items.
  outlook-bridge-qinora:
    build:
      context: ./backend
    profiles:
      - outlook
    depends_on:
      backend:
        condition: service_healthy
    environment:
      <<: *worker_environment
      QINORA_API_BASE_URL: http://backend:8000
      OUTLOOK_TENANT_ID: ${OUTLOOK_TENANT_ID:-}
      OUTLOOK_CLIENT_ID: ${OUTLOOK_CLIENT_ID:-}
      OUTLOOK_CLIENT_SECRET: ${OUTLOOK_CLIENT_SECRET_QINORA:-}
      OUTLOOK_REFRESH_TOKEN: ${OUTLOOK_REFRESH_TOKEN_QINORA:-}
      OUTLOOK_MAILBOXES: ${OUTLOOK_MAILBOXES_QINORA:-}
      OUTLOOK_SEND_MAILBOX: ${QINORA_CARRIER_MAILBOX:-}
      OUTLOOK_SENDER_NAME: ${OUTLOOK_SENDER_NAME:-Sandahls}
    volumes:
      - qinora_data:/app/data
    entrypoint: sh -c
    command:
      - 'while true; do python -m qinora.workers.outlook_bridge; sleep 60; done'
    healthcheck:
      disable: true

  postgres:
    image: postgres:16-alpine
    profiles:
      - postgres
    environment:
      POSTGRES_DB: qinora
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - qinora_postgres:/var/lib/postgresql/data

volumes:
  qinora_data:
  qinora_postgres:
