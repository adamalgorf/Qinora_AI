[project]
name = "qinora-backend"
version = "0.1.0"
description = "QiNora TMS Python backend"
requires-python = ">=3.12"
dependencies = [
  "email-validator>=2.3.0",
  "fastapi>=0.124.0",
  "psycopg[binary]>=3.2.0",
  "pydantic>=2.12.0",
  "uvicorn[standard]>=0.38.0"
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28.0",
  "pytest>=9.0.0",
  "pytest-asyncio>=1.3.0",
  "ruff>=0.14.0"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qinora"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
